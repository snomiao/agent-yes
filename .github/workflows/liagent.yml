name: liagent

# packages/liagent (shipped inside agent-yes as agent-yes/liagent): lint,
# format check, typecheck (tsrs), bun test, then the root build and a check
# of what the agent-yes package would ship. Runs when liagent, this workflow,
# or the root files that build and ship it change. Not a required check;
# release.yml also runs `bun run test:liagent` before publishing.

on:
  push:
    branches: [main]
    paths:
      - "packages/liagent/**"
      - ".github/workflows/liagent.yml"
      # Root files that decide how liagent is built and shipped.
      - "package.json"
      - "bun.lock"
      - "tsdown.config.ts"
  pull_request:
    branches: [main]
    paths:
      - "packages/liagent/**"
      - ".github/workflows/liagent.yml"
      # Root files that decide how liagent is built and shipped.
      - "package.json"
      - "bun.lock"
      - "tsdown.config.ts"

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # Root install: packages/* are workspaces. --ignore-scripts skips the
      # agent-yes CLI's native postinstalls, which liagent does not need.
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Check (lint, format, typecheck, tests)
        working-directory: packages/liagent
        run: bun run check
      # The root build is what release.yml runs before npm publish; it builds
      # packages/liagent/dist too.
      - name: Build (root)
        run: bun run build
      # What agent-yes ships: liagent's built entries, and no source maps.
      - name: agent-yes package contents
        run: |
          bun pm pack --dry-run --ignore-scripts > /tmp/pack.txt 2>&1
          for f in index.js index.d.ts box.js client.js protocol.js hub.js hub.d.ts cli.js liagent.js; do
            grep -q "packages/liagent/dist/$f" /tmp/pack.txt || { echo "missing from the package: packages/liagent/dist/$f" >&2; cat /tmp/pack.txt; exit 1; }
          done
          if grep -E "packages/liagent/(src|test)/|packages/liagent/dist/.*\.map" /tmp/pack.txt; then
            echo "liagent sources or source maps would ship" >&2; exit 1
          fi
          grep "packages/liagent/" /tmp/pack.txt
