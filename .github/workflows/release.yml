name: Release

on:
  push:
    branches:
      - main
      - beta

jobs:
  release:
    # Production can be frozen independently while main continues feeding the
    # beta channel. Repository variable HOLD_PROD=1 is the operator kill switch.
    if: vars.HOLD_PROD != '1'
    runs-on: ubuntu-latest
    # This job waits for rust-build.yml before it publishes to npm. That build
    # usually takes ~10 min, but one target has taken 32, and a timeout here
    # leaves a tagged GitHub release that never reaches npm or Docker. Same
    # budget as publish-beta below.
    timeout-minutes: 75
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
      id-token: write # to enable use of OIDC for trusted publishing and npm provenance
      actions: write # to trigger rust-build workflow
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # semantic-release needs full history to compute versions correctly
          # Don't bake the workflow's GITHUB_TOKEN into git's http.extraheader:
          # it overrides the RELEASE_TOKEN semantic-release embeds in the push
          # URL, so the version-bump push authenticated as github-actions[bot]
          # and was rejected by main's required checks (GH006, run 29158738669).
          # The repo is public — the fetches below work unauthenticated.
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "latest"
          registry-url: "https://registry.npmjs.org"
      - uses: oven-sh/setup-bun@v2
      - run: bun i
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rs
      - name: Build Rust binary
        working-directory: rs
        run: cargo build --release
      - run: bun run build
      - run: bun run test

      # semantic-release: bump version, update package.json + Cargo.toml,
      # create GitHub release + tag. npm publish is disabled (npmPublish: false).
      # After this, we explicitly dispatch rust-build.yml below.
      - run: bunx semantic-release
        env:
          # RELEASE_TOKEN (an admin PAT) instead of the default GITHUB_TOKEN:
          # main now has required status checks, and @semantic-release/git's
          # version-bump push would be rejected for the non-admin Actions token.
          # Admin pushes bypass the checks (enforce_admins is off). Falls back
          # to GITHUB_TOKEN if the secret is ever removed.
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Disable husky hooks so @semantic-release/git's commit doesn't trigger
          # pre-commit (fmt/build/test), which races the rust rebuild against
          # stale bins when rs/Cargo.toml was just bumped.
          HUSKY: "0"

      # The tag of the release semantic-release just made, or empty when it
      # made none. Its commit (@semantic-release/git) is the local HEAD, tagged
      # v<the version it wrote into package.json>. Anything else is not this
      # run's release: `git describe` used to return the nearest tag, which
      # after a no-release push (ci:, docs:, chore:) is an older tag, or the
      # beta tag publish-beta puts on this same commit. Every step below then
      # ran for it, and npm publish pushed package.json's version as latest:
      # harmless while that version was already on npm, but it published
      # 1.302.0 over 1.302.1 after 1.302.0's own release had timed out.
      - name: Get new release tag
        id: get_tag
        run: |
          WANT="v$(node -p "require('./package.json').version")"
          if git tag --points-at HEAD | grep -qxF "$WANT"; then TAG="$WANT"; else TAG=""; fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "New release tag: ${TAG:-none (no release this run)}"

      # Explicitly dispatch rust-build.yml so we can track the exact run ID.
      # (The release: published event on rust-build.yml is a backup; the dispatch here
      #  is what release.yml actually waits for.)
      - name: Trigger Rust build
        id: trigger_rust
        if: steps.get_tag.outputs.tag != ''
        run: |
          BEFORE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "Dispatching rust-build.yml for tag ${{ steps.get_tag.outputs.tag }} (after $BEFORE)..."
          gh workflow run rust-build.yml \
            --field tag=${{ steps.get_tag.outputs.tag }} \
            --field upload_release=true
          # Poll until we see the new run (created after dispatch)
          for i in $(seq 1 24); do
            sleep 5
            WANT="Build Rust Binaries ${{ steps.get_tag.outputs.tag }}"
            RUN_ID=$(gh run list --workflow=rust-build.yml --limit=10 --json databaseId,createdAt,displayTitle \
              -q ".[] | select(.createdAt >= \"$BEFORE\" and .displayTitle == \"$WANT\") | .databaseId" | head -1)
            if [ -n "$RUN_ID" ]; then
              echo "Found run ID: $RUN_ID"
              echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
              break
            fi
            echo "Waiting for run to appear... ($((i*5))s elapsed)"
          done
          if [ -z "$RUN_ID" ]; then
            echo "ERROR: rust-build.yml run not found after 2 minutes"
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for Rust build to complete
        if: steps.get_tag.outputs.tag != ''
        run: |
          echo "Watching rust-build.yml run ${{ steps.trigger_rust.outputs.run_id }}..."
          gh run watch "${{ steps.trigger_rust.outputs.run_id }}" --exit-status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Now publish to npm — binaries are guaranteed to be on the GitHub release.
      - name: Publish agent-yes to npm
        if: steps.get_tag.outputs.tag != ''
        run: npm publish --access public || echo "npm publish skipped (version already exists)"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish claude-yes to npm
        if: steps.get_tag.outputs.tag != ''
        run: |
          npm pkg set name=claude-yes
          npm publish --access public || echo "npm publish skipped (version already exists)"
          npm pkg set name=agent-yes
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The Docker image installs the version just published to npm, plus the
      # release's Rust binaries (docker-release.yml, docker/Dockerfile.release).
      - name: Build the Docker release image
        # Stable versions only: this job also releases the beta branch.
        if: steps.get_tag.outputs.tag != '' && !contains(steps.get_tag.outputs.tag, '-')
        run: |
          tag="${{ steps.get_tag.outputs.tag }}"
          gh workflow run docker-release.yml --ref "$GITHUB_REF_NAME" -f version="${tag#v}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # npm Trusted Publishing is bound to this workflow filename. Keep the beta
  # channel here as a parallel job so it receives the same OIDC trust as stable,
  # while retaining an independent prerelease and native-binary pipeline.
  publish-beta:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      actions: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "latest"
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Validate the checked-in stable version first. Several version-contract
      # tests intentionally reject prerelease semver; the stamp below exists
      # only for the publish artifact and its matching native binaries.
      - run: bun run test

      - name: Set unique beta version
        id: version
        shell: bash
        run: |
          BASE=$(node -p "require('./package.json').version.split('-')[0]")
          VERSION="${BASE}-beta.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          TAG="v${VERSION}"
          npm pkg set version="${VERSION}"
          sed -i.bak "s/^version = \".*\"/version = \"${VERSION}\"/" rs/Cargo.toml
          rm -f rs/Cargo.toml.bak
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${TAG} from ${GITHUB_SHA}"

      - run: bun run build

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "agent-yes ${VERSION} (beta)" \
            --notes "Automated beta build from main at ${GITHUB_SHA}. Install with: npm install -g agent-yes@beta"

      - name: Trigger matching native binary build
        id: rust
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          BEFORE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run rust-build.yml --ref main --field tag="$TAG" --field upload_release=true
          for attempt in $(seq 1 24); do
            sleep 5
            WANT="Build Rust Binaries $TAG"
            RUN_ID=$(gh run list --workflow=rust-build.yml --event workflow_dispatch --limit=10 \
              --json databaseId,createdAt,displayTitle \
              -q ".[] | select(.createdAt >= \"$BEFORE\" and .displayTitle == \"$WANT\") | .databaseId" | head -1)
            if [ -n "$RUN_ID" ]; then
              echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Waiting for $WANT to appear... ($((attempt * 5))s elapsed)"
          done
          echo "Native binary workflow did not start within two minutes." >&2
          exit 1

      - name: Wait for native binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run watch "${{ steps.rust.outputs.run_id }}" --exit-status

      - name: Verify prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          COUNT=$(gh release view "$TAG" --json assets --jq '.assets | length')
          if [ "$COUNT" -lt 7 ]; then
            echo "Expected at least 7 native archives on $TAG; found $COUNT." >&2
            exit 1
          fi

      - name: Publish agent-yes@beta
        run: npm publish --access public --tag beta --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish claude-yes@beta alias
        shell: bash
        run: |
          npm pkg set name=claude-yes
          npm publish --access public --tag beta --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
