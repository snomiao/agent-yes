name: liagent release

# Publish packages/liagent to npm as @agent-yes/liagent. Manual only: bump
# "version" in packages/liagent/package.json in a PR, merge it, then run this
# workflow from the Actions tab. It refuses to publish a version that is
# already on npm.
#
# One-time setup (the package owner):
#   - The @agent-yes scope must exist on npm (an npm org named agent-yes).
#   - Either configure npm trusted publishing for this repository and this
#     workflow file (no secret needed; provenance is attached), or add an
#     NPM_TOKEN secret with publish rights on @agent-yes.

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Pack and show what would be published, without publishing"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/liagent
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: bun install --frozen-lockfile --ignore-scripts
        working-directory: .
      - run: bun run check
      - run: bun run build
      - name: Refuse a version already on npm
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "@agent-yes/liagent@$v" version >/dev/null 2>&1; then
            echo "@agent-yes/liagent@$v is already published; bump the version first." >&2
            exit 1
          fi
      - name: Publish
        run: |
          # check and build ran above; skip prepublishOnly's second run.
          npm publish --ignore-scripts --access public --provenance ${{ inputs.dry-run && '--dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
