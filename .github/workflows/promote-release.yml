name: Promote main → release (1h soak)

# The release train: every hour, fast-forward the `release` branch to where
# main stood ONE HOUR AGO. Everything on main is already CI-gated pre-merge and
# live on beta.agent-yes.pages.dev (deploy-beta.yml) the moment it lands, so the
# hour is a soak window — time for a human or an agent to notice a bad change on
# beta and stop the train before prod. The push to `release` then triggers
# deploy-agent-yes.yml (prod Worker deploy), path-filtered so ts/-only batches
# move the branch without redeploying the site.
#
# The train also self-gates: it refuses to promote while beta is serving a
# commit older than the batch's last UI change (i.e. a beta deploy failed), and
# both deploys now assert the origin really serves what they shipped. See
# lab/ui/cf/assert-deployed.sh.
#
# Stop the train:  gh variable set HOLD_PROD --body 1     (resume: --body 0)
# Roll prod back:  git push origin <good-sha>:release --force
#                  (this workflow only fast-forwards, so the reset holds until
#                  main history moves past it and HOLD_PROD is clear)
#
# The push uses RELEASE_TOKEN (admin PAT, same as release.yml) — pushes made
# with the default GITHUB_TOKEN would NOT trigger the deploy workflow.

on:
  schedule:
    - cron: "7 * * * *" # hourly; :07 avoids the top-of-hour Actions rush
  workflow_dispatch:

concurrency:
  group: promote-release
  cancel-in-progress: false

permissions:
  contents: write # push the release branch
  actions: write # dispatch the deploy workflow after a promote

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need history to resolve "main as of 1 hour ago"
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Fast-forward release to main@{1 hour ago}
        env:
          HOLD_PROD: ${{ vars.HOLD_PROD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${HOLD_PROD:-0}" = "1" ]; then
            echo "HOLD_PROD=1 — train held, not promoting."
            exit 0
          fi
          TARGET=$(git rev-list -1 --before="1 hour ago" origin/main)
          if [ -z "$TARGET" ]; then
            echo "No main commit older than 1h — nothing to promote."
            exit 0
          fi
          CURRENT=$(git rev-parse -q --verify origin/release || true)
          if [ "$TARGET" = "$CURRENT" ]; then
            echo "release already at $TARGET — up to date."
            exit 0
          fi
          # Fast-forward only: if release isn't an ancestor of the target (a
          # manual rollback reset), leave it alone until main moves past it.
          if [ -n "$CURRENT" ] && ! git merge-base --is-ancestor "$CURRENT" "$TARGET"; then
            echo "release ($CURRENT) is not behind target ($TARGET) — manual state, skipping."
            exit 0
          fi
          # --- gate: beta must not be BEHIND what we are about to ship -----
          # Everything here is already CI-gated pre-merge, so the risk this
          # catches is not "bad code" — it is "the beta deploy for this UI
          # never actually landed", which no diff review can see (see
          # assert-deployed.sh for the two incidents).
          #
          # Compare against the newest SITE-touching commit up to TARGET, not
          # TARGET itself: beta only redeploys on site paths and tracks main's
          # tip, so on a ts/-only batch it legitimately serves an older commit,
          # and on a busy hour a newer one. Both are fine — "at or ahead of the
          # last UI commit" is the invariant that means beta deploys are
          # landing. Only strictly-behind means one failed.
          LAST_UI=$(git rev-list -1 "$TARGET" -- lab/ui scripts/build-rgui.ts || true)
          BETA=$(sh lab/ui/cf/live-build.sh https://beta.agent-yes.pages.dev || true)
          if [ -z "$LAST_UI" ]; then
            echo "No site-touching commit in history — nothing for beta to have deployed."
          elif [ -z "$BETA" ] || ! git rev-parse -q --verify "$BETA^{commit}" >/dev/null; then
            # FAIL-SAFE, deliberately. A silent stall is the failure mode this
            # whole design exists to avoid, and an unreachable/unknown beta is
            # not evidence prod would break — prod has its own post-deploy
            # assertion now. Say so loudly and keep the train moving.
            echo "::warning::Could not read beta's build stamp (got '${BETA:-<none>}') — promoting anyway."
          elif git merge-base --is-ancestor "$LAST_UI" "$BETA"; then
            echo "beta is at or ahead of $(git rev-parse --short "$LAST_UI") — ok to promote."
          else
            echo "::error::beta serves $BETA, which is BEHIND the last UI commit $(git rev-parse --short "$LAST_UI")."
            echo "Its deploy failed or never ran, so this batch has not been exercised anywhere. Holding."
            exit 1
          fi

          echo "Promoting release: ${CURRENT:-<new>} → $TARGET"
          git push origin "$TARGET:refs/heads/release"
          # The push above cannot be relied on to trigger the deploy workflow
          # (in practice the #271 batch moved release without any deploy run —
          # PAT trigger chains are fragile, and new-branch pushes never match
          # path filters). Dispatch it explicitly when the promoted batch
          # touches the site; deploy-agent-yes.yml is idempotent so a spurious
          # dispatch is merely a ~40s no-op redeploy.
          #
          # Pass the SHA we just promoted. Dispatching `--ref release` alone
          # races our own push: measured 2026-08-09, this step promoted
          # 8b4f24f→5f55ed9 and the deploy it launched 1.3s later ran at
          # 8b4f24f — the pre-push tip. Prod redeployed the OLD site and went
          # green, so the console served a stale service worker for hours with
          # nothing red anywhere. --ref still selects the workflow file; the
          # `sha` input decides what actually gets checked out and deployed.
          if [ -z "$CURRENT" ] || ! git diff --quiet "$CURRENT" "$TARGET" -- \
              lab/ui scripts/build-rgui.ts .github/workflows/deploy-agent-yes.yml; then
            echo "Batch touches site paths — dispatching prod deploy for $TARGET."
            gh workflow run deploy-agent-yes.yml --ref release -f sha="$TARGET"
          else
            echo "No site-path changes in this batch — deploy not needed."
          fi
